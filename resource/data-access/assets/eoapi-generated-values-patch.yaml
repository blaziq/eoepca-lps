ingress:
  annotations:
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false" 

postgrescluster:
  enabled: false
  postGISVersion: "3.4"

postgresql:
  type: "external-plaintext"
  external:
    host: "eoapi-db.eoepca.local"
    port: "5432"
    database: "eoapi"
    credentials:
      username: "eoapi"
      password: "eoapi"

raster:
  enabled: true
  settings:
    resources:
      requests:
        memory: "0"
      limits:
        memory: "1024Mi"

multidim:
  enabled: false
  settings:
    resources:
      requests:
        memory: "0"
      limits:
        memory: "1024Mi"

stac:
  enabled: true
  settings:
    resources:
      requests:
        cpu: "0"
        memory: "0"
      limits:
        memory: "1024Mi"

vector:
  enabled: true
  settings:
    resources:
      requests:
        memory: "0"
      limits:
        memory: "1024Mi"
